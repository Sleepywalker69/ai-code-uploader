<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 15px; width: 250px; }
    button { width: 100%; margin-top: 10px; padding: 8px; cursor: pointer;}
    input { width: 90%; margin-top: 10px; padding: 5px; }
    hr { margin: 15px 0; }
    #status { margin-top: 10px; font-size: 13px; color: #2ea043; font-weight: bold; }
  </style>
  <script src="jszip.min.js"></script>
</head>
<body>
  <h3>AI Code Uploader</h3>
  
  <label for="zipUpload">Upload ZIP file:</label>
  <input type="file" id="zipUpload" accept=".zip">
  
  <div id="status"></div>
  <hr>

  <label for="githubUrl">Or GitHub Repo URL:</label>
  <input type="text" id="githubUrl" placeholder="https://github.com/user/repo">
  <button id="fetchRepo">Fetch Repository (Coming Soon)</button>

  <script src="popup.js"></script>
</body>
</html>
